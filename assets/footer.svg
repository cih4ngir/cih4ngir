<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff41" opacity="0.05"/>
    </pattern>
    <style>
      .mono2 { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .c2 { animation: blink2 1.1s steps(1) infinite; }
      @keyframes blink2 { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
    </style>
  </defs>
  <rect width="1000" height="120" rx="10" fill="#0d1117"/>
  <rect width="1000" height="120" rx="10" fill="url(#scan2)"/>
  <rect x="2.5" y="2.5" width="995" height="115" rx="9" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.7"/>
  <text class="mono2" x="500" y="52" text-anchor="middle" fill="#00ff41" font-size="17" letter-spacing="3">WAR. WAR NEVER CHANGES.</text>
  <text class="mono2" x="500" y="82" text-anchor="middle" fill="#00ff41" font-size="17" letter-spacing="3" opacity="0.75">NEITHER DOES LEGACY CODE &#8212; UNTIL SOMEONE MIGRATES IT. <tspan class="c2">&#9608;</tspan></text>
</svg>
